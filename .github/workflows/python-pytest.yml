# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python testing

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A new push to a branch cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        # A pinned uv skips a GitHub API lookup of the latest release.
        version: "0.13.1"
        # Given the version, the action does not run uv to find one for the
        # cache key (up to ~12 s on Windows). It also sets UV_PYTHON.
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # Key the cache on the lock file alone, not the default glob over the
        # whole checkout. Downloaded PyPI wheels are kept in the cache (not
        # pruned), so a warm run downloads nothing from pypi.org.
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      # Only the test group: the dev group's JupyterLab is not needed to test.
      run: uv sync --locked --no-default-groups --group test
    - name: Test with pytest
      run: |
        uv run --no-sync python --version
        uv run --no-sync pytest

  forallpeople-4:
    # The lock pins forallpeople 3.4 (the oldest supported). forallpeople 4 shows
    # a defined unit as its unit alone ("kN", not "1 kN"); test that too, and its
    # temporary escape hatch back to the old display.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: forallpeople-4
    - name: Install dependencies, then forallpeople 4
      run: |
        uv sync --locked --no-default-groups --group test
        uv pip install "forallpeople>=4,<5"
    - name: Test with pytest
      run: uv run --no-sync pytest
    - name: Test with the legacy unit display
      env:
        FORALLPEOPLE_LEGACY_UNIT_REPR: "1"
      run: uv run --no-sync pytest -p no:warnings

  katex:
    # The Markdown renderer's math must typeset in KaTeX (JupyterLab, VS Code):
    # tests/test_markdown_renderer.py::test_math_typesets_with_katex, skipped
    # elsewhere, runs the demo and a stress calc through KaTeX in mini-racer.
    runs-on: ubuntu-latest
    env:
      KATEX_VERSION: "0.16.25"
      KATEX_SHA256: "76d534cf1167067008fca12c4e903fc44cf8cfda8c5279c318d1f78cd90b086e"
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        cache-suffix: katex
    - name: Install dependencies, mini-racer and KaTeX
      run: |
        uv sync --locked --no-default-groups --group test
        uv pip install mini-racer
        curl -sSfL -o "$RUNNER_TEMP/katex.min.js" \
          "https://cdn.jsdelivr.net/npm/katex@$KATEX_VERSION/dist/katex.min.js"
        echo "$KATEX_SHA256  $RUNNER_TEMP/katex.min.js" | sha256sum --check
    - name: Typeset the Markdown output with KaTeX
      run: |
        export HANDCALCS_KATEX_JS="$RUNNER_TEMP/katex.min.js"
        uv run --no-sync pytest tests/test_markdown_renderer.py -k katex -rs

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        # Its own cache: the key would otherwise match test (ubuntu, 3.13),
        # and whichever job saved first would leave the other a partial cache.
        cache-suffix: lint
    - name: Test black formatted
      run: uv run --locked --only-group lint black src --check

  package:
    # Build the wheel and import it in a bare environment (no dev or optional
    # dependencies), as a user's 'pip install handcalcs' would.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        # Its own cache: the key would otherwise match test (ubuntu, 3.13),
        # and whichever job saved first would leave the other a partial cache.
        cache-suffix: package
    - name: Build sdist and wheel
      run: uv build
    - name: Install the wheel into a bare venv and render
      run: |
        uv venv /tmp/bare
        uv pip install --python /tmp/bare dist/*.whl
        cd /tmp
        /tmp/bare/bin/python -c "from handcalcs import HandCalcs, ASCIIRenderer; print(HandCalcs(ASCIIRenderer())('a = 2\nb = a * 3'))"
