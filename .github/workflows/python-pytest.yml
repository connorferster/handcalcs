# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python testing

on:
  push:
    branches: [ "main", "hc2/dev" ]
  pull_request:
    branches: [ "main", "hc2/dev" ]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # uv otherwise follows .python-version and tests every cell on 3.13.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv sync
    - name: Test with pytest
      run: |
        uv run python --version
        uv run pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Test black formatted
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
        uv sync
        uv run black src --check

  package:
    # Build the wheel and import it in a bare environment (no dev or optional
    # dependencies), as a user's 'pip install handcalcs' would.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip build
        python -m build
    - name: Install the wheel into a bare venv and render
      run: |
        python -m venv /tmp/bare
        /tmp/bare/bin/pip install dist/*.whl
        cd /tmp
        /tmp/bare/bin/python -c "from handcalcs import HandCalcs, PlainTextRenderer; print(HandCalcs(PlainTextRenderer())('a = 2\nb = a * 3'))"
