# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python testing

on:
  push:
    branches: [ "main", "hc2/dev" ]
  pull_request:
    branches: [ "main", "hc2/dev" ]

# A new push to a branch cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        # A pinned uv skips a GitHub API lookup of the latest release.
        version: "0.13.1"
        # Given the version, the action does not run uv to find one for the
        # cache key (up to ~12 s on Windows). It also sets UV_PYTHON.
        python-version: ${{ matrix.python-version }}
        enable-cache: true
        # Key the cache on the lock file alone, not the default glob over the
        # whole checkout. Downloaded PyPI wheels are kept in the cache (not
        # pruned), so a warm run downloads nothing from pypi.org.
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      # Only the test group: the dev group's JupyterLab is not needed to test.
      run: uv sync --locked --no-default-groups --group test
    - name: Test with pytest
      run: |
        uv run --no-sync python --version
        uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        # Its own cache: the key would otherwise match test (ubuntu, 3.13),
        # and whichever job saved first would leave the other a partial cache.
        cache-suffix: lint
    - name: Test black formatted
      run: uv run --locked --only-group lint black src --check

  package:
    # Build the wheel and import it in a bare environment (no dev or optional
    # dependencies), as a user's 'pip install handcalcs' would.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false
    - uses: actions/setup-python@v7
      with:
        python-version: "3.13"
    - uses: astral-sh/setup-uv@v10.3.0
      with:
        version: "0.13.1"
        python-version: "3.13"
        enable-cache: true
        cache-dependency-glob: uv.lock
        # Its own cache: the key would otherwise match test (ubuntu, 3.13),
        # and whichever job saved first would leave the other a partial cache.
        cache-suffix: package
    - name: Build sdist and wheel
      run: uv build
    - name: Install the wheel into a bare venv and render
      run: |
        uv venv /tmp/bare
        uv pip install --python /tmp/bare dist/*.whl
        cd /tmp
        /tmp/bare/bin/python -c "from handcalcs import HandCalcs, PlainTextRenderer; print(HandCalcs(PlainTextRenderer())('a = 2\nb = a * 3'))"
