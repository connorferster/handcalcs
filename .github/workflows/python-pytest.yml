# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python testing

on:
  push:
    branches: [ "main", "hc2/dev" ]
  pull_request:
    branches: [ "main", "hc2/dev" ]

# A new push to a branch cancels its run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    env:
      # uv otherwise follows .python-version and tests every cell on 3.13.
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
    - uses: actions/checkout@v4
      with:
        # docs/ is ~25 MB of v1 images the tests never read; skipping it
        # roughly halves checkout time on Windows. (Root files are included.)
        sparse-checkout: |
          src
          tests
          scripts
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - uses: astral-sh/setup-uv@v6
      with:
        # A pinned uv skips a GitHub API lookup of the latest release.
        version: "0.13.1"
        enable-cache: true
        # Key the cache on the lock file alone: the default glob searches the
        # whole checkout, which takes ~4 s on Windows.
        cache-dependency-glob: uv.lock
        # Keep the wheels downloaded from PyPI in the cache too (the default
        # prunes them), so a warm run downloads nothing from pypi.org.
        prune-cache: false
    - name: Install dependencies
      # Only the test group: the dev group's JupyterLab is not needed to test.
      run: uv sync --locked --no-default-groups --group test
    - name: Test with pytest
      run: |
        uv run --no-sync python --version
        uv run --no-sync pytest

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.1"
        enable-cache: true
        cache-dependency-glob: uv.lock
        prune-cache: false
    - name: Test black formatted
      run: uv run --locked --only-group lint black src --check

  package:
    # Build the wheel and import it in a bare environment (no dev or optional
    # dependencies), as a user's 'pip install handcalcs' would.
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        version: "0.13.1"
        enable-cache: true
        cache-dependency-glob: uv.lock
        prune-cache: false
    - name: Build sdist and wheel
      run: uv build
    - name: Install the wheel into a bare venv and render
      run: |
        uv venv --python 3.13 /tmp/bare
        uv pip install --python /tmp/bare dist/*.whl
        cd /tmp
        /tmp/bare/bin/python -c "from handcalcs import HandCalcs, PlainTextRenderer; print(HandCalcs(PlainTextRenderer())('a = 2\nb = a * 3'))"
