name: "Temporary: first docs deploy to Bunny.net (from hc2/dev)"

on:
  # Temporary: deploys when this branch is pushed. Delete the branch when done.
  push:
    branches: [ "ci/docs-first-deploy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
    - name: Build docs
      # The 'doc' extra is Sphinx and its extensions; the 'test' group has the
      # libraries the live examples import (pint, forallpeople, numpy, ...).
      env:
        HC_SOURCE_REF: hc2/dev  # the v2 code lives on hc2/dev until it is merged to main
      run: |
        uv run --locked --no-default-groups --extra doc --group test sphinx-build -W -b html docs docs/_build/html
    - name: Deploy to BunnyCDN
      uses: ayeressian/bunnycdn-storage-deploy@v2.3.0 #
      with:
          source: "./docs/_build/html"
          destination: "."
          storageZoneName: "${{ secrets.STORAGE_NAME }}"
          storagePassword: "${{ secrets.STORAGE_PASSWORD }}"
          storageEndpoint: "uk.storage.bunnycdn.com"  # the storage zone's main region is London
          accessKey: "${{ secrets.STORAGE_KEY }}"
          pullZoneId: "${{ secrets.ZONE_ID }}"
          upload: "true"
          remove: "true"
          purgePullZone: "true"
          purgePullZoneDelay: "5"